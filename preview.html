<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Pro V4.14 - 命运因果版</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Noto+Serif+SC:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* 默认占星模式变量 (Mystic Mode) */
            --bg: #0b0718;
            --accent: #c084fc;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(192, 132, 252, 0.2);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            --glass-blur: 15px;
            --theme-color: #c084fc;
            --gyro-x: 0deg;
            --gyro-y: 0deg;
            --gyro-z: 0deg;
            --stars-offset-x: 0px;
            --stars-offset-y: 0px;
        }

        /* 易经模式变量 (Zen Mode) */
        .zen-mode {
            --bg: #fdfbf7;
            /* 和纸白 */
            --accent: #2d2d2d;
            /* 水墨黑 */
            --panel-bg: rgba(255, 255, 255, 0.75);
            /* 宣纸白 */
            --panel-border: rgba(45, 45, 45, 0.1);
            --text-main: #2d2d2d;
            --text-dim: rgba(45, 45, 45, 0.5);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            --glass-blur: 8px;
            --theme-color: #d4a017;
            /* 磨砂金 */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            background: var(--bg);
            overflow: hidden;
            font-family: 'Montserrat', 'Noto Serif SC', serif;
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            perspective: 1200px;
            transition: background 2s ease;
        }

        /* 舞台 */
        .stage-box {
            width: 100%;
            height: 42vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #stars-background {
            position: absolute;
            inset: -120px;
            display: grid;
            place-items: center;
            transform: translate(calc(var(--stars-offset-x) * 1.5), calc(var(--stars-offset-y) * 1.5)) rotateZ(var(--gyro-z));
            mask-image: radial-gradient(circle at center, black 10%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 85%);
            z-index: 10;
            pointer-events: none;
        }

        .visual-center {
            width: 360px;
            height: 360px;
            position: relative;
            display: grid;
            place-items: center;
            transform: rotateX(var(--gyro-y)) rotateY(var(--gyro-x)) translateZ(20px);
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
            z-index: 50;
        }

        .graphics-layer {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        #astro-core {
            transition: transform 5s cubic-bezier(0.15, 0.75, 0.25, 1);
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            place-items: center;
        }

        /* 行星点位 */
        .planet-node {
            position: absolute;
            width: 9px;
            height: 9px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff, 0 0 25px var(--theme-color);
            opacity: 0;
            transition: all 1.2s ease;
            z-index: 30;
        }

        .planet-node.highlight {
            width: 16px;
            height: 16px;
            box-shadow: 0 0 30px #fff, 0 0 60px var(--theme-color);
        }

        .planet-label {
            position: absolute;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.78rem;
            letter-spacing: 1.8px;
            width: 85px;
            text-align: center;
            left: -38px;
            top: 22px;
            transform: rotate(0deg) !important;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }

        .planet-node.highlight .planet-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            top: 28px;
        }

        .constellation-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .star-link {
            stroke: var(--theme-color);
            stroke-width: 1.2;
            opacity: 0.4;
            stroke-dasharray: 5, 15;
            animation: linkFlow 25s linear infinite;
            transition: all 1s ease;
        }

        @keyframes linkFlow {
            from {
                stroke-dashoffset: 200;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        /* 气旋按钮 */
        .nebula-trigger {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-color) 0%, transparent 75%);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: nebulaPulse 4s infinite ease-in-out;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        .zen-mode .nebula-trigger {
            background: radial-gradient(circle, rgba(212, 160, 23, 0.2) 0%, transparent 75%);
        }

        .nebula-core {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--text-main);
            filter: blur(14px);
            opacity: 0.6;
            box-shadow: 0 0 28px var(--theme-color);
            z-index: 1;
        }

        .nebula-aura {
            position: absolute;
            inset: -18px;
            border: 1.2px solid var(--panel-border);
            border-radius: 50%;
            animation: RotateLoop 15s linear infinite;
        }

        .nebula-hint {
            position: absolute;
            bottom: -38px;
            width: 150px;
            font-size: 0.74rem;
            color: var(--accent);
            letter-spacing: 4px;
            opacity: 0.5;
            text-align: center;
            animation: textBreath 3s infinite;
        }

        @keyframes nebulaPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes RotateLoop {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes textBreath {

            0%,
            100% {
                opacity: 0.35;
                transform: translateY(0);
            }

            50% {
                opacity: 0.9;
                transform: translateY(-4px);
            }
        }

        /* 易经元素 */
        .symbols-ring {
            position: absolute;
            width: 280px;
            height: 280px;
            animation: RotateLoop 40s linear infinite;
            opacity: 0.15;
        }

        .taiji-center {
            position: absolute;
            width: 90px;
            height: 90px;
            z-index: 5;
            opacity: 0.8;
            filter: drop-shadow(0 0 25px var(--accent));
            transition: all 1s;
        }

        .yao-core {
            display: flex;
            flex-direction: column-reverse;
            gap: 12px;
            /* 增加整体间距 */
            z-index: 20;
            position: relative;
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 内外卦结构化断层 */
        .yao-core::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -20px;
            width: 140%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--panel-border), transparent);
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 1s;
        }

        .yao-core.result-state::after {
            opacity: 1;
        }

        /* 结果状态下的位移：拉开内外卦间距 */
        .yao-core.result-state .yao-line:nth-child(n+4) {
            transform: translateY(-15px);
            /* 上卦位移 */
            margin-bottom: 5px;
        }

        .yao-line {
            width: 62px;
            height: 5px;
            background: var(--accent);
            opacity: 0.15;
            /* Mystic 模式下保持微透 */
            border-radius: 2.2px;
            opacity: 0;
            transform: scaleX(0);
            transition: 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .zen-mode .yao-line {
            background: var(--accent);
            /* 禅意模式下为水墨黑 */
            opacity: 0;
        }

        .yao-line.visible {
            opacity: 0.8;
            transform: scaleX(1);
        }

        .zen-mode .yao-line.visible {
            opacity: 1;
        }

        .yao-line.yin {
            background: transparent !important;
            border: none;
            display: flex;
            justify-content: space-between;
        }

        .yao-line.yin::before,
        .yao-line.yin::after {
            content: '';
            width: 42%;
            height: 100%;
            background: var(--accent);
            border-radius: 2.2px;
            transition: all 0.3s ease;
        }

        /* 动爻在阴爻上的特殊表现：两段都变金 */
        .yao-line.yin.moving::before,
        .yao-line.yin.moving::after {
            background: var(--theme-color);
            box-shadow: 0 0 15px var(--theme-color);
        }

        /* 移除旧的遮盖逻辑 */

        .yao-line.moving {
            background: var(--theme-color);
            border: none;
            box-shadow: 0 0 22px var(--theme-color);
        }

        /* 界面布局 */
        .panel-ui {
            position: absolute;
            top: 51%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.8s ease;
            z-index: 150;
        }

        .input-pill {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 12px 22px;
            border-radius: 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            width: 100%;
            text-align: left;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(var(--glass-blur));
        }

        .input-pill:focus-within {
            border-color: var(--theme-color);
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.15);
        }

        .input-pill input {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 100%;
            font-size: 1.05rem;
            font-family: inherit;
            outline: none;
            padding: 0;
        }

        .zen-mode .input-pill input::-webkit-calendar-picker-indicator {
            filter: invert(0);
            opacity: 0.6;
        }

        .input-pill input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }

        .input-pill::before {
            content: attr(data-label);
            position: absolute;
            top: -10px;
            left: 18px;
            font-size: 0.65rem;
            color: var(--theme-color);
            background: var(--bg);
            padding: 0 6px;
            opacity: 0.8;
            z-index: 10;
        }

        .btn-mode {
            background: transparent;
            border: 1.2px solid var(--panel-border);
            color: var(--text-main);
            padding: 9px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            margin-top: 10px;
            z-index: 200;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .btn-mode:hover {
            border-color: var(--theme-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: -10px;
            margin-bottom: 20px;
            padding-left: 10px;
        }

        .checkbox-group input {
            width: 14px;
            height: 14px;
            accent-color: var(--theme-color);
        }

        /* 响应式紧凑适配 */
        @media (max-height: 800px) {
            .visual-center {
                transform: scale(0.85);
                top: 30%;
            }

            .panel-ui {
                top: 48%;
            }

            .input-pill {
                margin-bottom: 12px;
                padding: 10px 18px;
            }

            .nebula-trigger {
                transform: scale(0.9);
                margin-bottom: 5px;
            }
        }

        @media (max-height: 700px) {
            .visual-center {
                transform: scale(0.75);
                top: 28%;
            }

            .panel-ui {
                top: 46%;
            }

            .input-pill {
                margin-bottom: 8px;
                opacity: 0.85;
            }
        }

        /* 结果展示层 */
        /* 结果展示层 - 升级为底吸式精致卡片 */
        .result-container {
            position: absolute;
            bottom: 30px;
            /* 改为底吸 */
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            width: 92%;
            max-width: 420px;
            background: rgba(var(--panel-bg), 0.85);
            /* 略微通透，能看到背景粒子 */
            border: 1px solid var(--panel-border);
            border-radius: 32px;
            padding: 35px 24px 85px 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(25px);
            /* 增强磨砂感 */
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .result-container.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 结果态下的图形联动：上移并微缩 */
        body.is-result-state .visual-center {
            top: 22% !important;
            transform: scale(0.7) !important;
        }

        #r-desc {
            font-size: 0.96rem;
            line-height: 1.75;
            opacity: 0.9;
            text-align: justify;
            color: var(--text-main);
            margin: 12px 0;
            padding: 15px;
            background: rgba(var(--theme-color), 0.05);
            border-radius: 16px;
            width: 100%;
        }

        .res-title {
            font-size: 2.5rem;
            font-family: 'Noto Serif SC';
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: 6px;
        }

        .card-row {
            display: flex;
            gap: 14px;
            margin: 25px 0;
        }

        .card {
            flex: 1;
            padding: 22px 12px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            backdrop-filter: blur(var(--glass-blur));
        }

        .main-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--panel-bg);
            border: none;
            border-top: 1px solid var(--panel-border);
            color: var(--theme-color);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1010;
            text-transform: uppercase;
        }

        .main-btn:hover {
            background: var(--theme-color);
            color: var(--bg);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }

        .star-dot {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: starPulse var(--speed) ease-in-out infinite var(--delay);
        }

        @keyframes starPulse {

            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.4);
            }
        }
    </style>
</head>

<body class="iching-mode" id="body-ctx">
    <div class="app-container" id="app">
        <div class="stage-box">
            <div id="stars-background"></div>
            <div class="visual-center" id="gyro-stage">
                <div class="graphics-layer" id="iching-graphics">
                    <div id="ring" class="symbols-ring"></div>
                    <svg class="taiji-center" id="taiji" viewBox="0 0 100 100">
                        <path d="M50 0 A50 50 0 0 1 50 100 A25 25 0 0 1 50 50 A25 25 0 0 0 50 0 Z"
                            fill="var(--accent)" />
                        <path d="M50 100 A50 50 0 0 1 50 0 A25 25 0 0 1 50 50 A25 25 0 0 0 50 100 Z"
                            fill="var(--theme-color)" style="opacity:0.6;" />
                    </svg>
                    <div id="yao-box" class="yao-core"></div>
                </div>
                <div class="graphics-layer" id="astro-graphics" style="display:none; opacity:0;">
                    <div id="astro-core">
                        <div id="star-vault" style="position:absolute; inset:-120px;"></div>
                        <svg class="constellation-svg" id="star-links"></svg>
                        <div id="planets-layer" style="position:absolute; inset:0;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-ui" id="iching-input">
            <div class="nebula-trigger" onclick="runIChing()">
                <div class="nebula-aura"></div>
                <div class="nebula-core"></div>
                <span
                    style="font-size:1.6rem; z-index:2; position:relative; filter:drop-shadow(0 0 10px var(--theme-color));">✨</span>
                <div class="nebula-hint">触碰 · 开启卦象</div>
            </div>
            <h2
                style="font-family:'Noto Serif SC'; color:var(--text-main); margin:0; font-size:1.8rem; letter-spacing:3px;">
                易经起卦</h2>
            <button class="btn-mode" onclick="saveModeAndSwitch('astro')">切换：西占星历 ➔</button>
        </div>
        <div class="panel-ui" id="astro-input" style="display:none;">
            <!-- 核心操作区置顶 -->
            <div class="nebula-trigger" onclick="runAstro()" style="margin-bottom: 5px;">
                <div class="nebula-aura"></div>
                <div class="nebula-core"></div>
                <!-- 补全星光符号 -->
                <span
                    style="font-size:1.6rem; z-index:2; position:relative; filter:drop-shadow(0 0 10px var(--theme-color));">✨</span>
                <div class="nebula-hint">触碰 · 开启星门</div>
            </div>
            <h2
                style="font-family:'Noto Serif SC'; color:var(--text-main); margin:0 0 10px 0; font-size:1.75rem; letter-spacing:3px;">
                星轨校准</h2>

            <!-- 输入区收紧与下沉 -->
            <div style="width:100%; padding:0 35px; margin-bottom:10px;">
                <div class="input-pill" data-label="出生日期" style="margin-bottom:12px;">
                    <input type="date" id="birth-date">
                </div>
                <div class="input-pill" data-label="出生地点 (国家 - 省 - 市)" style="margin-bottom:12px;">
                    <input type="text" placeholder="中国 - 上海 - 静安" id="birth-place">
                </div>
                <div style="display:flex; gap:10px; align-items:flex-start;">
                    <div class="input-pill" data-label="出生时间" style="flex:1; margin-bottom:8px;">
                        <input type="time" id="birth-time">
                    </div>
                    <div class="checkbox-group" style="margin-top:12px;">
                        <input type="checkbox" id="time-unknown">
                        <label for="time-unknown" style="white-space:nowrap; font-size:0.7rem;">时间不详</label>
                    </div>
                </div>
            </div>

            <button class="btn-mode" onclick="saveModeAndSwitch('iching')" style="margin-top:5px;">➔ 切换：易经起卦</button>
        </div>

        <div class="result-container" id="result-board">
            <div class="res-title" id="r-name">标题</div>
            <div class="res-tag" id="r-tag"
                style="color:var(--theme-color); font-size:0.85rem; letter-spacing:4px; font-weight:600; margin-bottom:24px;">
                ★ 特征描述 ★</div>
            <div class="card-row">
                <div class="card">
                    <div
                        style="font-family:'Noto Serif SC';font-size:1.4rem;color:var(--theme-color);margin-bottom:8px;">
                        宜</div>
                    <div id="yi-text" style="color:var(--text-main); font-size:0.92rem; font-weight:600;"></div>
                </div>
                <div class="card">
                    <div style="font-family:'Noto Serif SC';font-size:1.4rem;color:#8e8e93;margin-bottom:8px;">忌</div>
                    <div id="ji-text" style="color:#8e8e93; font-size:0.92rem; font-weight:600;"></div>
                </div>
            </div>
            <p id="r-desc"></p>
            <button class="main-btn" onclick="location.reload()">毕 · 顺应自如</button>
        </div>
    </div>

    <script>
        // ---------------- 命运因果映射 (The Destiny Map) ----------------
        const ASTRO_DESTINIES = [
            {
                name: "冥王星 · 涅槃",
                tag: "★ 深度蜕变之门 ★",
                yi: "· 复盘内心<br>· 清理旧物",
                ji: "· 开启新约<br>· 情绪对抗",
                desc: "冥王星正在你的潜意识宫位深耕。这并非灾难，而是一场灵魂土壤的翻新。那些被掩埋的真实愿望正在苏醒，请保持诚实。",
                color: "#c084fc",
                mainPlanet: "Pluto",
                // 十字形星阵 (十字架)
                pattern: [
                    { p: "Sun", r: 140, a: 0 },
                    { p: "Moon", r: 140, a: Math.PI },
                    { p: "Mars", r: 80, a: Math.PI / 2 },
                    { p: "Jupiter", r: 80, a: -Math.PI / 2 },
                    { p: "Pluto", r: 0, a: 0 } // 居中主星
                ],
                links: [[0, 1], [2, 3], [0, 2], [2, 1], [1, 3], [3, 0]]
            },

        function restoreBirthData() {
            const dIn = document.getElementById('birth-date');
            const tIn = document.getElementById('birth-time');
            const pIn = document.getElementById('birth-place');
            const uCh = document.getElementById('time-unknown');
            if (!dIn) return;

            const savedDate = localStorage.getItem('astro_birth_date');
            const savedTime = localStorage.getItem('astro_birth_time');
            const savedPlace = localStorage.getItem('astro_birth_place');
            const savedUnknown = localStorage.getItem('astro_time_unknown') === 'true';

            if (savedDate) dIn.value = savedDate;
            if (savedTime) tIn.value = savedTime;
            if (savedPlace) pIn.value = savedPlace;
            if (savedUnknown) {
                uCh.checked = true;
                tIn.disabled = true;
                tIn.style.opacity = "0.3";
            }

            const sync = () => {
                localStorage.setItem('astro_birth_date', dIn.value);
                localStorage.setItem('astro_birth_time', tIn.value);
                localStorage.setItem('astro_birth_place', pIn.value);
                localStorage.setItem('astro_time_unknown', uCh.checked);
            };

            [dIn, tIn, pIn, uCh].forEach(el => {
                el.addEventListener('input', sync);
                el.addEventListener('change', sync);
            });

            uCh.addEventListener('change', (e) => {
                tIn.disabled = e.target.checked;
                tIn.style.opacity = e.target.checked ? "0.3" : "1";
                sync();
            });
        }

        async function runAstro() {
            try {
                // 0. 参数校验与生成种子
                const bDate = document.getElementById('birth-date').value;
                const bTime = document.getElementById('time-unknown').checked ? "12:00" : document.getElementById('birth-time').value;
                const bPlace = document.getElementById('birth-place').value;
                if (!bDate || !bPlace) {
                    alert("请填写完整的出生信息，以观测星轨");
                    return;
                }

                // 1. 动态确定性天机 (Deterministic Seed + Hour Flow)
                const destinySeed = bDate + bTime + bPlace;
                const hourTick = Math.floor(Date.now() / (1000 * 60 * 60)); // 每小时演化一次
                const inputSeed = destinySeed + hourTick;
                let hash = 0;
                for (let i = 0; i < inputSeed.length; i++) {
                    hash = ((hash << 5) - hash) + inputSeed.charCodeAt(i);
                    hash |= 0;
                }
                const luckyIndex = Math.abs(hash) % ASTRO_DESTINIES.length;
                const fate = ASTRO_DESTINIES[luckyIndex];

                // 2. 注入主题色与背景
                document.documentElement.style.setProperty('--theme-color', fate.color);
                document.getElementById('app').style.background = `radial-gradient(circle at center, ${fate.color}22 0%, #0b0718 100%)`;

                document.getElementById('astro-input').style.opacity = '0';
                setTimeout(() => document.getElementById('astro-input').style.display = 'none', 800);

                const core = document.getElementById('astro-core');
                core.style.transform = 'rotate(360deg)';

                const planetsLayer = document.getElementById('planets-layer');
                const svgLayer = document.getElementById('star-links');
                const astroG = document.getElementById('astro-graphics');
                astroG.style.display = 'grid';
                astroG.style.opacity = '1';
                planetsLayer.innerHTML = ''; svgLayer.innerHTML = '';

                const nodesRef = [];

                // 3. 按照因果阵法生成星象
                for (let i = 0; i < fate.pattern.length; i++) {
                    const cfg = fate.pattern[i];
                    await new Promise(r => setTimeout(r, 600));

                    const node = document.createElement('div');
                    node.className = 'planet-node' + (cfg.p === fate.mainPlanet ? ' highlight' : '');

                    const x = 180 + Math.cos(cfg.a) * cfg.r;
                    const y = 180 + Math.sin(cfg.a) * cfg.r;
                    node.style.left = x + 'px'; node.style.top = y + 'px';

                    const lab = document.createElement('div'); lab.className = 'planet-label'; lab.innerText = cfg.p;
                    node.appendChild(lab); planetsLayer.appendChild(node);
                    nodesRef.push({ x, y, node });

                    setTimeout(() => { if (node) node.style.opacity = '1'; }, 100);

                    if (fate.links) {
                        fate.links.forEach(link => {
                            if (link[1] === i && nodesRef[link[0]]) {
                                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                                line.setAttribute("x1", nodesRef[link[0]].x);
                                line.setAttribute("y1", nodesRef[link[0]].y);
                                line.setAttribute("x2", nodesRef[link[1]].x);
                                line.setAttribute("y2", nodesRef[link[1]].y);
                                line.setAttribute("class", "star-link");
                                svgLayer.appendChild(line);
                            }
                        });
                    }
                }

                await new Promise(r => setTimeout(r, 1200));
                showResult(fate.name, fate.tag, fate.yi, fate.ji, fate.desc, false);
            } catch (err) {
                console.error(err);
                alert("星轨校准异常，请尝试刷新页面");
            }
        }

        // ---------------- 历法逻辑 (Twelve Gods Almanac) ----------------
        function getDailyAlmanac() {
            const today = new Date();
            const y = today.getFullYear(); const m = today.getMonth() + 1; const d = today.getDate();

            // 简单日期偏移量（以2024年初为基准的简化建除循环）
            const baseDate = new Date(2024, 0, 1);
            const diffDays = Math.floor((today - baseDate) / (1000 * 60 * 60 * 24));
            const godIndex = diffDays % 12;

            // 十二建除定义
            const twelveGods = [
                { name: "建日", yi: "祈福, 出行", ji: "开仓, 动土", desc: "万物生养之日" },
                { name: "除日", yi: "清理, 扫舍", ji: "求医, 远行", desc: "去旧布新之日" },
                { name: "满日", yi: "开市, 交易", ji: "动土, 裁制", desc: "丰收圆满之日" },
                { name: "平日", yi: "修造, 治网", ji: "祈福, 远行", desc: "平稳和谐之日" },
                { name: "定日", yi: "冠笄, 入口", ji: "词讼, 搬迁", desc: "安定不动之日" },
                { name: "执日", yi: "捕捉, 固堤", ji: "开市, 搬迁", desc: "执持操守之日" },
                { name: "破日", yi: "拆卸, 坏垣", ji: "办大事, 祈福", desc: "破旧裂开之日" },
                { name: "危日", yi: "祭祀, 捕捉", ji: "登山, 冒险", desc: "谨言慎行之日" },
                { name: "成日", yi: "开市, 嫁娶", ji: "词讼, 争执", desc: "成就圆满之日" },
                { name: "收日", yi: "纳财, 捕捉", ji: "安葬, 远行", desc: "收敛入库之日" },
                { name: "开日", yi: "会友, 结盟", ji: "安葬, 启攒", desc: "豁然大开之日" },
                { name: "闭日", yi: "筑堤, 埋葬", ji: "看诊, 出行", desc: "闭塞不通之日" }
            ];

            const currentGod = twelveGods[godIndex];

            return {
                yi: currentGod.yi.split(', '),
                ji: currentGod.ji.split(', '),

            };
        }

        function showResult(name, tag, yi, ji, desc, isIching = false) {
            document.body.classList.add('is-result-state');
            const board = document.getElementById('result-board');
            // ...其余内容保持不变
            const daily = getDailyAlmanac();

            document.getElementById('r-name').innerText = name;
            document.getElementById('r-tag').innerText = tag;

            // 融合算法：1项来自卦象/星位，1项来自今日天时
            const finalYi = `· ${yi.split('<br>')[0].replace('· ', '')}<br>· ${daily.yi[0]}`;
            const finalJi = `· ${ji.split('<br>')[0].replace('· ', '')}<br>· ${daily.ji[0]}`;

            document.getElementById('yi-text').innerHTML = finalYi;
            document.getElementById('ji-text').innerHTML = finalJi;
            document.getElementById('r-desc').innerText = desc;

            board.style.display = 'flex';
            setTimeout(() => board.classList.add('visible'), 50);

            if (isIching) {
                document.getElementById('ring').style.opacity = '0';
                document.getElementById('taiji').style.opacity = '0';
                document.body.classList.add('zen-mode');
            } else {
                document.getElementById('astro-graphics').style.opacity = '0.92';
            }
        }
    </script>
</body>

</html>
